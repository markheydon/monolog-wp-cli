name: PHP CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runtime-compat:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        php-version: ['8.1', '8.2', '8.3', '8.4', '8.5']

    name: Runtime PHP ${{ matrix.php-version }}

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          tools: composer
          coverage: none
        env:
          COMPOSER_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate composer.json and composer.lock
        run: composer validate --strict

      - name: Install dependencies
        run: composer update --prefer-dist --no-progress --no-interaction --no-dev

      - name: Run runtime smoke test
        run: composer run test:runtime-smoke

  unit-tests:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            php-version: '8.1'
            phpunit-version: '^9.6'
          - os: ubuntu-latest
            php-version: '8.2'
            phpunit-version: '^9.6'
          - os: ubuntu-latest
            php-version: '8.3'
            phpunit-version: '^12.5'
          - os: ubuntu-latest
            php-version: '8.4'
            phpunit-version: '^12.5'
          - os: ubuntu-latest
            php-version: '8.5'
            phpunit-version: '^12.5'

    name: Unit PHP ${{ matrix.php-version }}

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          tools: composer
          coverage: none
        env:
          COMPOSER_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: composer update --prefer-dist --no-progress --no-interaction --with-all-dependencies monolog/monolog psr/log wp-cli/wp-cli phpmd/phpmd pdepend/pdepend symfony/config:^5.4 symfony/finder:^5.4 phpunit/phpunit:${{ matrix.phpunit-version }}

      - name: Run test suite
        run: vendor/bin/phpunit

  qa-tooling:
    name: Tooling PHP 8.3
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer
          coverage: none
        env:
          COMPOSER_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Audit dependencies
        run: composer audit --locked --no-interaction

      - name: Run PHPMD
        run: composer run lint:md

      - name: Run PHPCS
        run: composer run lint:cs

  wordpress-smoke:
    strategy:
      fail-fast: false
      matrix:
        include:
          - wordpress-version: '7.0'
            php-version: '8.4'
          - wordpress-version: '7.0'
            php-version: '8.5'
          - wordpress-version: '6.8'
            php-version: '8.3'
          - wordpress-version: '6.8'
            php-version: '8.4'

    name: WordPress ${{ matrix.wordpress-version }} PHP ${{ matrix.php-version }}

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          tools: composer
          coverage: none
        env:
          COMPOSER_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install runtime dependencies
        run: composer update --prefer-dist --no-progress --no-interaction --no-dev

      - name: Start WordPress environment
        env:
          WORDPRESS_VERSION: ${{ matrix.wordpress-version }}
          WORDPRESS_PHP_VERSION: ${{ matrix.php-version }}
        run: composer run wp:env:up

      - name: Set up WordPress smoke fixture
        env:
          WORDPRESS_VERSION: ${{ matrix.wordpress-version }}
          WORDPRESS_PHP_VERSION: ${{ matrix.php-version }}
        run: composer run test:wp:setup

      - name: Run WordPress smoke checks
        env:
          WORDPRESS_VERSION: ${{ matrix.wordpress-version }}
          WORDPRESS_PHP_VERSION: ${{ matrix.php-version }}
        run: composer run test:wp:smoke

      - name: Tear down WordPress environment
        if: always()
        env:
          WORDPRESS_VERSION: ${{ matrix.wordpress-version }}
          WORDPRESS_PHP_VERSION: ${{ matrix.php-version }}
        run: composer run wp:env:down
